<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>MINECRAP</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
<style>
/* VOICE: loud, goofy, proud: a kid-made parody game with real polish
   IDEA: the title screen and HUD of a blocky survival sandbox, online with friends
   PICTURE: the live 3D world itself, slowly orbiting behind the logo
   COLOUR and TYPE: sky blue, grass green, dirt brown, stone-grey buttons; Press Start 2P + VT323
   LAYOUT: full-screen canvas, centred logo over stacked stone buttons, hearts + hotbar along the bottom */
:root{color-scheme:light dark;--slot:clamp(34px,9.4vw,54px)}
*{box-sizing:border-box;min-width:0}
html,body{margin:0;height:100%;overflow:hidden;background:#8ec5ff;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
body{font:20px/1.2 'VT323',monospace;color:#fff}
#c{position:fixed;inset:0;width:100%;height:100%;display:block}
.hide,[hidden]{display:none!important}
.ov{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:safe center;gap:10px;padding:20px 16px 44px;text-align:center;overflow-y:auto;background:radial-gradient(ellipse at center,rgba(0,0,0,.15),rgba(0,0,0,.6))}
.logo{position:relative;font:clamp(26px,9vw,76px)/1.05 'Press Start 2P',monospace;color:#f4efe2;letter-spacing:.02em;text-shadow:0 .07em 0 #8a5a30,0 .14em 0 #5a3a1c,0 .21em 0 #3a2410,0 .3em .25em rgba(0,0,0,.45);margin:0 0 .45em}
.splash{position:absolute;right:-.4em;bottom:-1.2em;font:clamp(9px,2.4vw,17px)/1 'Press Start 2P',monospace;color:#ffef3a;text-shadow:2px 2px 0 #3f3a00;transform:rotate(-12deg);white-space:nowrap;animation:pop .45s ease-in-out infinite alternate}
@keyframes pop{to{transform:rotate(-12deg) scale(1.1)}}
@media (prefers-reduced-motion:reduce){.splash{animation:none}}
.col{display:flex;flex-direction:column;gap:9px;width:min(340px,92vw)}
.row{display:flex;gap:8px}.row>*{flex:1}
.btn{font:12px/1.3 'Press Start 2P',monospace;color:#fff;text-shadow:2px 2px 0 #3a3a3a;background:#7d7d7d;border:3px solid #111;box-shadow:inset 3px 3px 0 #b0b0b0,inset -3px -3px 0 #555;min-height:46px;width:100%;cursor:pointer;padding:4px 10px}
.btn:hover,.btn:focus-visible{background:#8792c4;outline:none;box-shadow:inset 3px 3px 0 #bcc6f2,inset -3px -3px 0 #4f5a8c}
.btn:disabled{opacity:.45;cursor:default;background:#555;box-shadow:none}
.btn small{display:block;font:16px/1 'VT323',monospace;color:#ffef3a;margin-top:3px}
.tx{font:22px 'VT323',monospace;height:46px;padding:0 10px;background:rgba(0,0,0,.65);color:#fff;border:3px solid #a0a0a0;width:100%;outline:none;border-radius:0}
.tx:focus{border-color:#ffef3a}
.tx.code{text-transform:uppercase;letter-spacing:.3em;text-align:center}
.lbl{font-size:18px;color:#ddd;text-shadow:2px 2px 0 #000;text-align:left;margin-bottom:-5px}
.help{max-width:560px;color:#eee;text-shadow:2px 2px 0 #000;font-size:19px;margin:4px 0 0}
.help b{color:#ffef3a;font-weight:normal}
.note{color:#ffd2c8;text-shadow:2px 2px 0 #000;min-height:22px;max-width:520px;font-size:20px}
.note a{color:#ffef3a}
.foot{position:fixed;bottom:8px;left:12px;right:12px;display:flex;justify-content:space-between;gap:10px;font-size:18px;text-shadow:2px 2px 0 #000;pointer-events:none}
#hud{position:fixed;inset:0;pointer-events:none}
#cross{position:absolute;left:50%;top:50%;width:22px;height:22px;margin:-11px 0 0 -11px}
#cross::before,#cross::after{content:'';position:absolute;background:#fff;box-shadow:0 0 0 1px rgba(0,0,0,.5)}
#cross::before{left:10px;top:0;width:2px;height:22px}#cross::after{top:10px;left:0;height:2px;width:22px}
#mineBar{position:absolute;left:50%;top:calc(50% + 20px);width:44px;height:6px;margin-left:-22px;background:rgba(0,0,0,.6);border:1px solid #000}
#mineBar i{display:block;height:100%;width:0;background:#fff}
#bar{position:absolute;left:50%;bottom:max(10px,env(safe-area-inset-bottom));transform:translateX(-50%);display:flex;background:rgba(0,0,0,.5);border:3px solid #1a1a1a;pointer-events:auto}
.slot{position:relative;width:var(--slot);aspect-ratio:1;border:2px solid #8b8b8b;display:grid;place-items:center;background:rgba(90,90,90,.35);cursor:pointer}
.slot.on{outline:3px solid #fff;outline-offset:-3px;background:rgba(255,255,255,.18)}
.slot img,.it img{width:80%;image-rendering:pixelated;pointer-events:none}
.slot b,.it b{position:absolute;right:3px;bottom:0;font:20px/1 'VT323',monospace;font-weight:normal;text-shadow:2px 2px 0 #000}
#stats{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(max(10px,env(safe-area-inset-bottom)) + var(--slot) + 12px);width:calc(var(--slot)*9);display:flex;justify-content:space-between}
#stats div{display:flex}#stats img{width:calc(var(--slot)*.42);image-rendering:pixelated}
#food{flex-direction:row-reverse}
#name{position:absolute;left:0;right:0;bottom:calc(var(--slot)*1.42 + 40px);text-align:center;font-size:26px;text-shadow:2px 2px 0 #000;transition:opacity .4s;opacity:0}
#info{position:absolute;left:10px;top:8px;font-size:19px;text-shadow:2px 2px 0 #000;line-height:1.05}
#info span{color:#ffef3a}
#hand{position:absolute;right:5%;bottom:8%;width:clamp(70px,13vw,130px);image-rendering:pixelated;transform:rotate(-15deg);transform-origin:90% 90%;transition:transform .1s}
#hand.sw{transform:rotate(-75deg) translate(-10px,-20px)}
#hurt{position:fixed;inset:0;background:radial-gradient(transparent 35%,rgba(210,0,0,.6));opacity:0;transition:opacity .35s;pointer-events:none}
#night{position:fixed;inset:0;pointer-events:none}
#tags{position:fixed;inset:0;pointer-events:none;overflow:hidden}
.tag{position:absolute;transform:translate(-50%,-100%);font:19px/1 'VT323',monospace;background:rgba(0,0,0,.55);padding:2px 6px;white-space:nowrap}
#chat{position:absolute;left:10px;bottom:calc(var(--slot)*1.42 + 80px);width:min(440px,72vw);font-size:20px;display:flex;flex-direction:column;align-items:flex-start;gap:2px}
.cl{background:rgba(0,0,0,.5);padding:1px 6px;text-shadow:2px 2px 0 #000;transition:opacity 1s;overflow-wrap:anywhere}
.cl.sys{color:#ffef3a}
#chatIn{position:fixed;left:10px;right:10px;top:50px;width:auto;z-index:5}
body.touch #info{top:60px;font-size:17px}
body.touch #chat{top:104px;bottom:auto;width:min(300px,60vw);font-size:18px}
body.touch #hand{display:none}
#tc{position:fixed;inset:0;pointer-events:none}
#joy{position:absolute;left:18px;bottom:calc(var(--slot)*1.42 + 50px);width:132px;height:132px;border-radius:50%;background:rgba(255,255,255,.14);border:3px solid rgba(255,255,255,.4);pointer-events:auto;touch-action:none}
#knob{position:absolute;left:38px;top:38px;width:50px;height:50px;border-radius:50%;background:rgba(255,255,255,.6)}
.tb{position:absolute;pointer-events:auto;touch-action:none;font:10px/1.2 'Press Start 2P',monospace;color:#fff;background:rgba(50,50,50,.55);border:3px solid rgba(255,255,255,.5);width:66px;height:66px;border-radius:12px;text-shadow:1px 1px 0 #000;padding:0}
.tb:active,.tb.lit{background:rgba(255,239,58,.5)}
#bJump{right:16px;bottom:calc(var(--slot)*1.42 + 50px)}#bMine{right:90px;bottom:calc(var(--slot)*1.42 + 100px)}
#bPlace{right:16px;bottom:calc(var(--slot)*1.42 + 124px)}#bFly{right:90px;bottom:calc(var(--slot)*1.42 + 26px)}
#bMenu{right:10px;top:10px;width:46px;height:44px}#bBag{right:62px;top:10px;width:58px;height:44px}#bChat{right:126px;top:10px;width:66px;height:44px}
.panel{width:min(560px,94vw);display:grid;gap:10px;text-align:left}
.panel h2{font:14px/1.3 'Press Start 2P',monospace;margin:6px 0 0;text-shadow:2px 2px 0 #000}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:6px}
.it{position:relative;background:rgba(0,0,0,.55);border:2px solid #8b8b8b;aspect-ratio:1;display:grid;place-items:center;cursor:pointer;color:#fff;padding:0}
.it:hover,.it:focus-visible{border-color:#fff;outline:none;background:rgba(255,255,255,.15)}
.empty{color:#bbb;font-size:19px;text-shadow:2px 2px 0 #000}
.rc{display:flex;align-items:center;gap:6px;width:100%;min-height:50px;background:rgba(0,0,0,.55);border:2px solid #8b8b8b;color:#fff;font:19px/1 'VT323',monospace;padding:4px 8px;cursor:pointer;text-align:left}
.rc img{width:30px;image-rendering:pixelated}.rc .n{margin-right:4px}.rc .ar{color:#ffef3a;margin:0 4px}.rc .nm{margin-left:auto;color:#ffef3a}
.rc:disabled{opacity:.4;cursor:default}.rc:not(:disabled):hover{border-color:#fff}
#inv,#chestUI{background:rgba(0,0,0,.8)}
body.ovopen #hud,body.ovopen #tc{visibility:hidden}
#dead{background:rgba(120,0,0,.55)}
#dead h2{font:clamp(22px,6vw,44px)/1.1 'Press Start 2P',monospace;margin:0;text-shadow:3px 3px 0 #000}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="tags"></div>

<div id="hud" class="hide">
  <div id="cross"></div>
  <div id="mineBar" class="hide"><i></i></div>
  <div id="info"></div>
  <div id="chat"></div>
  <img id="hand" alt="">
  <div id="name"></div>
  <div id="stats"><div id="hearts"></div><div id="food"></div></div>
  <div id="bar"></div>
</div>
<div id="hurt"></div>

<div id="tc" class="hide">
  <div id="joy"><div id="knob"></div></div>
  <button class="tb" id="bJump">JUMP</button>
  <button class="tb" id="bMine">MINE</button>
  <button class="tb" id="bPlace">USE</button>
  <button class="tb" id="bFly">FLY</button>
  <button class="tb" id="bChat">CHAT</button>
  <button class="tb" id="bBag">BAG</button>
  <button class="tb" id="bMenu">II</button>
</div>
<input id="chatIn" class="tx hide" maxlength="140" placeholder="Say something... (Enter to send)" autocomplete="off">

<div id="menu" class="ov">
  <h1 class="logo">MINECRAP<span class="splash" id="splash">Now with 20% more crap!</span></h1>
  <div class="col" id="mMain">
    <div class="lbl">Your name</div>
    <input class="tx" id="nameIn" maxlength="16" autocomplete="off" spellcheck="false">
    <button class="btn" id="resume" hidden>Resume</button>
    <button class="btn" id="bSolo">Play solo</button>
    <button class="btn" id="bOnline">Play online<small id="onlineN">Jump into the public server</small></button>
    <div class="row"><button class="btn" id="bCreate">Create room</button><button class="btn" id="bMode">Survival</button></div>
    <div class="row"><input class="tx code" id="codeIn" maxlength="4" placeholder="CODE" autocomplete="off" spellcheck="false"><button class="btn" id="bJoin">Join</button></div>
    <button class="btn" id="bLeave" hidden>Leave room</button>
    <button class="btn" id="bNew">New solo world</button>
  </div>
  <div class="note" id="note"></div>
  <p class="help" id="help"></p>
  <div class="foot"><span>A Max original. Also try BLOCKBURG!</span><span>v2.0</span></div>
</div>

<div id="inv" class="ov hide"><div class="panel" id="invP"></div><button class="btn" style="width:min(320px,86vw)" data-close>Done</button></div>
<div id="chestUI" class="ov hide"><div class="panel" id="chestP"></div><button class="btn" style="width:min(320px,86vw)" data-close>Close chest</button></div>
<div id="dead" class="ov hide"><h2>You died!</h2><p class="help" id="deadWhy"></p><div class="col"><button class="btn" id="bRespawn">Respawn</button></div></div>
<div id="err" class="ov hide"><h2>Your browser can't run 3D (WebGL is off).</h2><p class="help">Try Chrome, Edge or Firefox on a computer.</p></div>

<script>
{
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const cv=$('#c');
const gl=cv.getContext('webgl',{antialias:false,alpha:false});
if(!gl){$('#err').classList.remove('hide');$('#menu').classList.add('hide')}
else{

const rng=s=>()=>{s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296};
const SPL=['Now with 20% more crap!','Totally not that other game!','Made by Max!','Also try BLOCKBURG!','100% organic!','Do not eat the brown blocks!','Now online!','Beware the Stinker!','Oinkloaf is friend!','Mine it. Craft it. Crap it.','Sock Goblins steal socks!'];
$('#splash').textContent=SPL[Math.random()*SPL.length|0];

/* ================= TEXTURES ================= */
const B=[null,
 {n:'Grass',t:[0,1,2]},{n:'Dirt',t:[2,2,2]},{n:'Stone',t:[3,3,3]},{n:'Cobblestone',t:[4,4,4]},
 {n:'Log',t:[6,5,6]},{n:'Leaves',t:[7,7,7],tr:1},{n:'Planks',t:[8,8,8]},{n:'Sand',t:[9,9,9]},
 {n:'Brick',t:[10,10,10]},{n:'Crap Block',t:[11,11,11]},{n:'Bedrock',t:[12,12,12]},
 {n:'Glass',t:[13,13,13],tr:1},{n:'Gold Block',t:[14,14,14]},{n:'Chest',t:[16,15,16]}];
const AW=256,AH=48,AT=document.createElement('canvas');AT.width=AW;AT.height=AH;
const ax=AT.getContext('2d'),img=ax.createImageData(AW,AH);
const sh=(c,k)=>[c[0]*k,c[1]*k,c[2]*k];
function tile(i,f){const r=rng(i*977+13),ox=(i&15)*16,oy=(i>>4)*16;for(let y=0;y<16;y++)for(let x=0;x<16;x++){const c=f(x,y,r),o=((oy+y)*AW+ox+x)*4;img.data[o]=c[0];img.data[o+1]=c[1];img.data[o+2]=c[2];img.data[o+3]=c[3]===undefined?255:c[3]}}
const EDGE=[3,4,3,2,3,4,5,4,3,3,2,3,4,3,4,3];
const face=(base,mouth,eye)=>(x,y,r)=>{if((x===4||x===5||x===10||x===11)&&(y===5||y===6))return(x===5||x===11)&&y===6?[20,12,6]:(eye||[245,245,240]);
 if((y===11&&x>=5&&x<=10)||(y===10&&(x===4||x===11)))return mouth;return sh(base,.88+r()*.18)};
const plank=(x,y,r)=>sh([170,136,82],y%4===3?.62:x===((Math.floor(y/4)*5+2)%16)?.72:.9+r()*.12);
const swirl=(base,r,x,y)=>{const dx=x-7.5,dy=y-8.5;return sh(base,(Math.sin(Math.hypot(dx,dy)*1.6+Math.atan2(dy,dx))>.55?.66:.92)+r()*.18)};
tile(0,(x,y,r)=>sh([96,162,56],.8+r()*.3));
tile(1,(x,y,r)=>y<EDGE[x]?sh([96,162,56],.8+r()*.3):sh([134,96,67],.8+r()*.35));
tile(2,(x,y,r)=>sh([134,96,67],.8+r()*.35));
tile(3,(x,y,r)=>sh([128,128,128],r()<.08?.65:.84+r()*.24));
{const r=rng(99),pts=[];for(let i=0;i<9;i++)pts.push([r()*16,r()*16,.72+r()*.4]);
tile(4,(x,y,rr)=>{let d1=99,d2=99,k=0;for(let i=0;i<9;i++){const p=pts[i];let dx=Math.abs(x+.5-p[0]),dy=Math.abs(y+.5-p[1]);dx=Math.min(dx,16-dx);dy=Math.min(dy,16-dy);const d=Math.hypot(dx,dy);if(d<d1){d2=d1;d1=d;k=i}else if(d<d2)d2=d}
 return d2-d1<1.1?[66,66,66]:sh([132,132,132],pts[k][2]+rr()*.12)})}
tile(5,(x,y,r)=>sh([104,82,50],(x%4===1?.7:.95)+r()*.12));
tile(6,(x,y,r)=>{const d=Math.max(Math.abs(x-7.5),Math.abs(y-7.5));return d>6.6?sh([104,82,50],.8+r()*.1):sh(Math.floor(d)%2?[158,126,74]:[184,152,98],.92+r()*.1)});
tile(7,(x,y,r)=>{const c=sh([58,128,40],.65+r()*.45);c[3]=r()<.2?0:255;return c});
tile(8,plank);
tile(9,(x,y,r)=>sh([222,210,162],.9+r()*.14));
tile(10,(x,y,r)=>{const row=y>>2;return y%4===3||(x+(row%2)*4)%8===7?[176,170,164]:sh([152,64,46],.82+r()*.26)});
{const f=face([118,74,36],[45,24,10]);tile(11,(x,y,r)=>{const c=f(x,y,r);return c.length&&c[0]>200||c[0]<50?c:swirl([118,74,36],r,x,y)})}
tile(12,(x,y,r)=>{const v=r();return v<.35?[34,34,34]:v<.7?[78,78,78]:[124,124,124]});
tile(13,(x,y)=>x===0||y===0||x===15||y===15?[214,236,246,255]:(x-y===4||x-y===5||x-y===-7)&&x>1&&x<14?[236,248,255,255]:[0,0,0,0]);
tile(14,(x,y,r)=>x===0||y===0||x===15||y===15?[196,140,18]:(x+y)%7===0?[255,246,150]:sh([250,206,48],.92+r()*.1));
tile(15,(x,y,r)=>x===0||y===0||x===15||y===15?[78,56,30]:(x>=7&&x<=8&&y>=6&&y<=9)?[205,205,205]:y===7?[96,70,38]:plank(x,y,r));
tile(16,(x,y,r)=>x===0||y===0||x===15||y===15?[78,56,30]:plank(x,y,r));
tile(17,face([200,146,74],[90,50,20]));
tile(18,(x,y,r)=>(x+y)%6===0&&y>2&&y<13?[236,200,130]:sh([200,146,74],.86+r()*.18));
tile(19,(x,y,r)=>sh([142,92,42],.85+r()*.2));
{const f=face([110,86,36],[40,20,8],[255,90,60]);tile(20,(x,y,r)=>y===4&&((x>=3&&x<=5)||(x>=10&&x<=12))?[30,16,6]:f(x,y,r))}
tile(21,(x,y,r)=>r()<.04?[150,205,60]:swirl([110,86,36],r,x,y));
tile(22,face([96,170,80],[30,60,25],[250,230,80]));
tile(23,(x,y,r)=>sh(y%4<2?[232,232,232]:[220,60,60],.88+r()*.14));
tile(24,(x,y,r)=>sh([96,170,80],.85+r()*.2));
{const f=face([234,192,150],[150,80,70],[255,255,255]);tile(25,(x,y,r)=>y<3?sh([90,60,30],.8+r()*.3):f(x,y,r))}
tile(26,(x,y,r)=>sh([234,192,150],.93+r()*.1));
tile(27,(x,y,r)=>sh([50,70,140],x===7?.7:.85+r()*.2));
const SHIRTS=[[210,50,50],[50,100,220],[60,170,70],[235,200,40],[150,70,200],[240,130,40]];
SHIRTS.forEach((c,i)=>tile(28+i,(x,y,r)=>sh(c,y<2&&x>4&&x<11?.6:.85+r()*.15)));
tile(34,(x,y,r)=>sh([90,60,30],.8+r()*.3));
ax.putImageData(img,0,0);

/* ================= ITEMS + ICONS ================= */
// 1-14 are blocks (and items). 20+ are tools, food and stuff.
const ITEM={20:{n:'Stick'},21:{n:'Wood Sword',dmg:4},22:{n:'Stone Sword',dmg:5},23:{n:'Gold Sword',dmg:7},24:{n:'Crap Sword',dmg:5,kb:2.6},
 25:{n:'Wood Pickaxe',pick:1},26:{n:'Stone Pickaxe',pick:2},27:{n:'Apple',food:4},28:{n:'Mystery Meat',food:6},29:{n:'Gold Apple',food:10},30:{n:'Loaf Slice',food:5}};
for(let t=1;t<B.length;t++)ITEM[t]={n:B[t].n,block:1};
const icon={};
for(let t=1;t<B.length;t++){const c=document.createElement('canvas');c.width=c.height=48;const g=c.getContext('2d');g.imageSmoothingEnabled=false;
 const T=B[t].t,fc=(tl,m,dark)=>{g.setTransform(...m);g.drawImage(AT,(tl&15)*16,(tl>>4)*16,16,16,0,0,16,16);if(dark){g.globalCompositeOperation='source-atop';g.fillStyle=`rgba(0,0,0,${dark})`;g.fillRect(0,0,16,16);g.globalCompositeOperation='source-over'}};
 fc(T[0],[20/16,-10/16,20/16,10/16,4,14],0);fc(T[1],[20/16,10/16,0,22/16,4,14],.22);fc(T[1],[20/16,-10/16,0,22/16,24,24],.42);icon[t]=c.toDataURL()}
function pixIcon(draw){const c=document.createElement('canvas');c.width=c.height=16;const g=c.getContext('2d');draw((x,y,col)=>{g.fillStyle=col;g.fillRect(x,y,1,1)});

function addMob(k,x,y,z,id){const d=MOB[k],m={id:id||'m'+(mobSeq++),k,x,y,z,vx:0,vy:0,vz:0,w:d.w,h:d.h,yaw:Math.random()*6.28,hp:d.hp,ground:false,hurt:0,atk:0,wt:0,dx:0,dz:0,ph:0,flee:0};mobs.set(m.id,m);return m}

function mobAI(m,dt){const d=MOB[m.k];m.hurt=Math.max(0,m.hurt-dt);m.atk=Math.max(0,m.atk-dt);
 let mx=0,mz=0,sp=d.sp,tg=null,td=1e9;
 if(d.hostile&&mode==='survival')for(const p of allPlayers()){const dd=Math.hypot(p.x-m.x,p.z-m.z);if(dd<td&&dd<18&&Math.abs(p.y-m.y)<8){td=dd;tg=p}}
 if(tg){mx=tg.x-m.x;mz=tg.z-m.z;if(td<1.15+d.w/2&&Math.abs(tg.y-m.y)<1.7&&m.atk<=0){m.atk=1.1;hitPlayer(tg,d.dmg,mx/td,mz/td,d.kill)}if(td<.8)mx=mz=0}
 else{m.wt-=dt;if(m.wt<=0){m.wt=2+Math.random()*4;const a=Math.random()*6.283,go=Math.random()<.6;m.dx=go?Math.sin(a):0;m.dz=go?Math.cos(a):0}
  mx=m.dx;mz=m.dz;sp*=.55;if(m.flee>0){m.flee-=dt;sp=d.sp*2.2}}
 const l=Math.hypot(mx,mz);if(l>.01){mx/=l;mz/=l;m.yaw=Math.atan2(-mx,-mz)}
 if(m.hurt<.25){const k=Math.min(1,dt*(m.ground?10:2));m.vx+=(mx*sp-m.vx)*k;m.vz+=(mz*sp-m.vz)*k}
 m.vy=Math.max(-40,m.vy-28*dt);step(m,dt);
 if(m.bump&&l>.01&&m.vy===0)m.vy=7.6;
 m.ph+=Math.hypot(m.vx,m.vz)*dt*3;if(m.y<-5)mobs.delete(m.id)}
let spawnT=0,syncT=0;
function mobTick(dt){
 for(const m of mobs.values())mobAI(m,dt);
 spawnT-=dt;if(spawnT>0)return;spawnT=1;
 const ps=allPlayers(),night=isNight();let hostile=0,passive=0;
 for(const m of [...mobs.values()]){let near=1e9;for(const p of ps)near=Math.min(near,Math.hypot(p.x-m.x,p.z-m.z));
  if(near>56||(!night&&MOB[m.k].hostile&&Math.random()<.08)){mobs.delete(m.id);continue}MOB[m.k].hostile?hostile++:passive++}
 if(!ps.length)return;const p=ps[Math.random()*ps.length|0];
 let k=null;if(night&&hostile<10)k=Math.random()<.55?'stink':'gob';else if(passive<7&&Math.random()<.45)k='loaf';if(!k)return;
 const a=Math.random()*6.283,r=16+Math.random()*12,x=Math.floor(p.x+Math.sin(a)*r),z=Math.floor(p.z+Math.cos(a)*r);
 if(x<1||z<1||x>=W-1||z>=D-1)return;let y=H-1;while(y>0&&!get(x,y,z))y--;const t=get(x,y,z);
 if((t!==1&&t!==8&&t!==2)||get(x,y+1,z)||get(x,y+2,z))return;
 if(MOB[k].hostile&&ps.some(q=>Math.hypot(q.x-x,q.z-z)<12))return;addMob(k,x+.5,y+1,z+.5)}
function hitMob(m,dmg,kx,kz,from){m.hp-=dmg;m.hurt=.4;m.vx=kx*6;m.vz=kz*6;m.vy=5;if(!MOB[m.k].hostile){m.flee=3;m.dx=kx;m.dz=kz;m.wt=3}
 if(m.hp<=0){mobs.delete(m.id);sfx(150,.25,'sawtooth');if(mode==='survival'){const items=MOB[m.k].drop();if(from==='me')giveAll(items);else netTo(from,{t:'loot',items})}}}
function syncMobs(list){const seen=new Set();for(const r of list){const[id,k,x,y,z,yaw,hp,hurt]=r;if(!MOB[k])continue;seen.add(id);let m=mobs.get(id);
  if(!m){m=addMob(k,x,y,z,id)}m.tx=x;m.ty=y;m.tz=z;m.tyaw=yaw;m.hp=hp;if(hurt)m.hurt=Math.max(m.hurt,.15)}
 for(const id of [...mobs.keys()])if(!seen.has(id))mobs.delete(id)}
function lerpMobs(dt){const k=1-Math.exp(-dt*12);for(const m of mobs.values()){if(m.tx===undefined)continue;const ox=m.x,oz=m.z;
 m.x+=(m.tx-m.x)*k;m.y+=(m.ty-m.y)*k;m.z+=(m.tz-m.z)*k;let dy=m.tyaw-m.yaw;dy=Math.atan2(Math.sin(dy),Math.cos(dy));m.yaw+=dy*k;m.ph+=Math.hypot(m.x-ox,m.z-oz)*3;m.hurt=Math.max(0,m.hurt-dt)}}

function box(a,M,p,ph,swingArm){const[cx,cy,cz,sx,sy,sz,tl,sw]=p,s=M.s;
 let rot=0;if(sw===1||sw===-1)rot=Math.sin(ph)*.7*sw;else if(sw===2||sw===-2)rot=Math.sin(ph)*.6*(sw/2);
 if(sw===-2&&swingArm)rot-=swingArm*1.6;
 const py=cy+sy/2,cr=Math.cos(rot),sr=Math.sin(rot),cyw=Math.cos(M.yaw),syw=Math.sin(M.yaw);
 FACES.forEach((f,fi)=>{const t=Array.isArray(tl)?tl[fi]:tl,lt=f[3]+(M.hurt?2:0);
  for(const k of ORD){const c=f[4][k];let lx=cx+(c[0]-.5)*sx,ly=cy+(c[1]-.5)*sy,lz=cz+(c[2]-.5)*sz;
   if(rot){const dy=ly-py,dz=lz-cz;ly=py+dy*cr-dz*sr;lz=cz+dy*sr+dz*cr}
   const uv=tuv(t,UV[k][0],UV[k][1]);a.push(M.x+(lx*cyw+lz*syw)*s,M.y+ly*s,M.z+(-lx*syw+lz*cyw)*s,uv[0],uv[1],lt)}})}
const shirtOf=n=>{let h=0;for(const c of String(n))h=(h*31+c.charCodeAt(0))|0;return Math.abs(h)%SHIRTS.length};

let mining=null,atkCd=0,swingT=0;
function lookTarget(){const r=ray(),eye=[P.x,P.y+1.62,P.z],d=dir();let best=null,bd=Math.min(r?r.t:1e9,3.6);
 for(const m of mobs.values()){const h=m.w/2,t=rayBox(eye,d,[m.x-h,m.y,m.z-h],[m.x+h,m.y+m.h,m.z+h]);if(t!==null&&t<bd){bd=t;best={kind:'mob',m}}}
 for(const[id,p]of net.players){if(!p.s)continue;const t=rayBox(eye,d,[p.x-.35,p.y,p.z-.35],[p.x+.35,p.y+1.85,p.z+.35]);if(t!==null&&t<bd){bd=t;best={kind:'player',id,p}}}
 return best||(r?{kind:'block',r}:null)}
function swing(){swingT=.25;const h=$('#hand');h.classList.add('sw');setTimeout(()=>h.classList.remove('sw'),120)}
function attack(tg){swing();const it=ITEM[held()]||{},dmg=it.dmg||1,kb=it.kb||1,tx=tg.kind==='mob'?tg.m.x:tg.p.x,tz=tg.kind==='mob'?tg.m.z:tg.p.z;
 let kx=tx-P.x,kz=tz-P.z;const l=Math.hypot(kx,kz)||1;kx=kx/l*kb;kz=kz/l*kb;
 if(held()===24)sfx(90,.35,'sawtooth',.1);else sfx(160,.1,'square');
 if(tg.kind==='mob'){if(boss())hitMob(tg.m,dmg,kx,kz,'me');else{netTo(net.leader,{t:'mhit',id:tg.m.id,dmg,kx,kz});tg.m.hurt=.4}}
 else if(mode==='survival'){tg.p.hurt=.4;netTo(tg.id,{t:'pvp',dmg,kx,kz,by:myName()})}}
function breakBlock(r){const t=get(r.x,r.y,r.z);if(!t||t===11)return;const i=I(r.x,r.y,r.z),loot=t===14?Object.entries(chests.get(i)||{}).map(([a,b])=>[+a,b]):[];
 if(mode==='survival'){const d=drops(t);if(!d.length&&STONY[t])toast(t===13?'Needs a Stone Pickaxe!':'Needs a pickaxe!');giveAll(d.concat(loot))}
 setB(r.x,r.y,r.z,0);if(openChestI===i)closeOv();t===10?sfx(110,.4,'sawtooth'):sfx(190,.12)}
function useItem(repeat){const id=held(),it=ITEM[id],r=ray();
 if(!repeat&&r&&get(r.x,r.y,r.z)===14){openChest(I(r.x,r.y,r.z));return}
 if(!repeat&&it&&it.food){eat(id);return}
 if(!r||!it||!it.block)return;const{px,py,pz}=r;
 if(px<0||pz<0||px>=W||pz>=D||py<1||py>=H||get(px,py,pz))return;
 if(px<P.x+.3&&px+1>P.x-.3&&pz<P.z+.3&&pz+1>P.z-.3&&py<P.y+1.8&&py+1>P.y)return;
 for(const m of mobs.values())if(px<m.x+m.w/2&&px+1>m.x-m.w/2&&pz<m.z+m.w/2&&pz+1>m.z-m.w/2&&py<m.y+m.h&&py+1>m.y)return;
 if(!take(id,1))return;setB(px,py,pz,id);if(id===14){chests.set(I(px,py,pz),{});chestChanged(I(px,py,pz))}swing();sfx(330,.07)}

const keys={};let tJump=false,jx=0,jy=0,hold=null,holdT=0,bumpT=0;
function update(dt){
 const live=!ovOpen()&&!dead&&!chatOpen;let f=0,s=0;
 if(drag&&!drag.moved&&!drag.held&&!locked&&(drag.touch||lockFails>0)&&performance.now()-drag.t>280){drag.held=1;hold=drag.btn===2?'place':'break';holdT=0;if(hold==='place'){holdT=.3;useItem(false)}}
 if(live){f=(keys.KeyW?1:0)-(keys.KeyS?1:0)-jy;s=(keys.KeyD?1:0)-(keys.KeyA?1:0)+jx;
  if(keys.ArrowLeft)P.yaw+=dt*2.2;if(keys.ArrowRight)P.yaw-=dt*2.2;
  if(keys.ArrowUp)P.pitch=Math.min(1.55,P.pitch+dt*1.8);if(keys.ArrowDown)P.pitch=Math.max(-1.55,P.pitch-dt*1.8)}
 if(mode!=='creative')P.fly=false;
 const jump=live&&(keys.Space||tJump),shift=live&&(keys.ShiftLeft||keys.ShiftRight),l=Math.hypot(f,s);if(l>1){f/=l;s/=l}
 const sprint=shift&&!P.fly&&food>6,sp=P.fly?11:sprint?6.6:4.3,fx=-Math.sin(P.yaw),fz=-Math.cos(P.yaw),rx=Math.cos(P.yaw),rz=-Math.sin(P.yaw);
 const k=Math.min(1,dt*(P.ground||P.fly?14:5));if(invuln<.3){P.vx+=((fx*f+rx*s)*sp-P.vx)*k;P.vz+=((fz*f+rz*s)*sp-P.vz)*k}
 if(P.fly)P.vy+=(((jump?1:0)-(shift?1:0))*8-P.vy)*Math.min(1,dt*10);
 else{P.vy=Math.max(-40,P.vy-28*dt);if(jump&&P.ground)P.vy=8.6}
 const was=P.ground;step(P,dt);
 if(touch&&P.bump&&was&&!P.fly&&l>.3)P.vy=8.6;
 if(P.y>H+30)P.y=H+30;
 // falling hurts
 if(P.fly||P.ground&&was)P.peak=P.y;else if(!P.ground)P.peak=Math.max(P.peak,P.y);
 if(P.ground&&!was){const fall=P.peak-P.y;if(fall>3.4)damage(Math.floor(fall-3),'fell from a high place');P.peak=P.y}
 // hunger + healing
 if(mode==='survival'&&!dead){food=Math.max(0,food-dt*(sprint&&l>.1?.06:.022));
  if(food>=16&&hp<20){regenT+=dt;if(regenT>3){regenT=0;hp=Math.min(20,hp+1);food=Math.max(0,food-.4)}}
  if(food<=0&&hp>1){starveT+=dt;if(starveT>5){starveT=0;hp-=1;hurtT=.4}}renderStats()}
 invuln=Math.max(0,invuln-dt);atkCd=Math.max(0,atkCd-dt);swingT=Math.max(0,swingT-dt);
 // mining and fighting
 let mp=0;
 if(hold==='break'&&live){const tg=lookTarget();
  if(tg&&tg.kind!=='block'){mining=null;if(atkCd<=0){atkCd=.45;attack(tg)}}
  else if(tg){const r=tg.r;
   if(mode==='creative'){holdT-=dt;if(holdT<=0){breakBlock(r);swing();holdT=.25}}
   else{const key=r.x+','+r.y+','+r.z;if(!mining||mining.key!==key)mining={key,p:0};mining.p+=dt/mineTime(get(r.x,r.y,r.z));mp=mining.p;
    if(swingT<=0){swing();sfx(120,.04,'square',.03)}if(mining.p>=1){breakBlock(r);mining=null}}}
  else mining=null}else mining=null;
 $('#mineBar').classList.toggle('hide',!mp);if(mp)$('#mineBar i').style.width=Math.min(100,mp*100)+'%';
 if(hold==='place'&&live){holdT-=dt;if(holdT<=0){useItem(true);holdT=.25}}}
